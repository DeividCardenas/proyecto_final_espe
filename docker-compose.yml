version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: chicago_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chicago_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chicago_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-chicago_safety}
    ports:
      - "5432:5432"
    shm_size: 1g
    volumes:
      - postgis_data:/var/lib/postgresql/data
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chicago_admin} -d ${POSTGRES_DB:-chicago_safety}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chicago_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Modificamos la URL para que apunte al nombre del contenedor 'db' en lugar de 'localhost'
      DATABASE_URL: postgresql+psycopg://chicago_admin:chicago_secure_pass_2026@db:5432/chicago_safety
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgis_data:
