upstream backend_api {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Caché en disco de teselas vectoriales MVT (inmutables para un mismo rango de fechas)
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=512m inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    client_max_body_size 15M;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: assets precomprimidos en build (gzip_static) + compresión dinámica del API
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/geo+json
        application/x-ndjson
        application/x-protobuf
        application/vnd.mapbox-vector-tile
        application/javascript
        image/svg+xml;

    # Cabeceras de seguridad y CSP (snippet reutilizado: add_header en un location anula los heredados)
    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"frontend-web"}';
    }

    location /api/v1/tiles/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache tiles;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Proxy reverso hacia FastAPI: mismo origen para el navegador (sin CORS)
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
